; ---------------------------------------------------------------------------
;  HP3 Split-Screen  -  configuration
;  Every value is optional; the defaults shown are what the mod uses if the
;  key (or this whole file) is missing.
;  Key values are Windows virtual-key codes in DECIMAL. Common ones:
;    numpad 0-9 = 96..105   numpad . = 110   numpad + = 107   numpad - = 109
;    A-Z        = 65..90    F1..F12  = 112..123
; ---------------------------------------------------------------------------

[split]
; Number of views, side by side, left to right. 1 disables the split.
; Player 1 is always the leftmost strip. Valid range 1-8.
Players=2
; StartOn=1 brings the split up automatically as soon as the level is running,
; with no key press at all.
StartOn=0
; Key that toggles the split in game. 121 = F10 (the default).
; F9 is NOT used: the game binds F9 to its own screenshot command.
ToggleKey=121

; ---------------------------------------------------------------------------
;  Player 2 controls - same scheme as the original player:
;    forward/back walk, left/right TURN (tank). Turning is the only input
;    that rotates the view. StrafeMode=1 restores the old strafe-on-left/right.
; ---------------------------------------------------------------------------
[player2]
Forward=104     ; numpad 8
Back=98         ; numpad 2
Left=100        ; numpad 4   (TURN left, unless StrafeMode=1)
Right=102       ; numpad 6   (TURN right, unless StrafeMode=1)
Jump=96         ; numpad 0
Cast=110        ; numpad .
Use=107         ; numpad +
Release=109     ; numpad -   (tell the companion AI to let go; also automatic)

; Left/Right behaviour for player 2:
;   StrafeMode=0  left/right TURN  - the original player's arrow-key scheme
;                 (DEFAULT). F/H and numpad 4/6 rotate the view.
;   StrafeMode=1  left/right STRAFE, view yaw never changes from those keys.
StrafeMode=0
; Extra dedicated turn keys (always turn, even in StrafeMode=1). 81 = Q, 69 = E.
TurnLeft=81
TurnRight=69
; Turn rate in degrees per second at full deflection. Range 20..400.
TurnSpeed=180
; NumLock-proof alternates, always active in addition to the numpad above:
;   T / G           forward / back
;   F / H           TURN left / right  (same as original Left/Right)
;   Q / E           also turn
;   R jump,  Y cast,  V use
; Gamepad - XInput (Xbox 360 / DualSenseX) first, then DualSense HID:
;   Left stick Y = walk, X = tank-turn
;   Right stick X = TURN (camera follows behind, like the original player)
;                    unless [camera] FreeCamera=1 (orbit camera for testing)
;   Right stick Y = camera pitch AND vertical spell aim
;   A / DualSense Cross = jump
;   Right trigger = cast (hold aim, release fire)
;   X / DualSense Square = use
;   While holding cast: a sparkling glow - rendered by the game's OWN
;   cursor effect (v20), the same look player 1's aim has - rides the
;   spell's flight line. It hugs whatever you point at, stays in cast
;   range (never parks at the far wall, never touches the caster's body),
;   snaps back from walls and vanishes on release.
; v12+ scans XInput slots 0-3 (DualSenseX no matter which slot it took) and
; detects native DualSense by caps, not name. Jumps only work on the ground.
; hp3mod.log: "[pad] player 2 CLAIMED XInput slot N" or
;             "profile=SONY/DualSense (caps: >=13 buttons & >=6 axes)"

; Player 3 (only used when Players=3 or more). I/J/K/L are unbound in game.
[player3]
Forward=73      ; I
Back=75         ; K
Left=74         ; J
Right=76        ; L
Jump=85         ; U
Cast=79         ; O
Use=80          ; P

[camera]
; v13 FreeCamera: how the right stick's horizontal axis behaves.
;   FreeCamera=0 (DEFAULT) - like the original player: right stick X TURNS
;     the character, camera stays behind. The character always faces where
;     the camera points, and casts aim where the camera points (yaw AND
;     pitch - aim up/down with right stick Y).
;   FreeCamera=1 - free-orbit camera for testing: right stick X orbits the
;     camera around the character without turning them.
FreeCamera=0
; Trailing camera for players 2..N (player 1 keeps the game's own camera).
; v14: the camera ORBITS the character by yaw AND pitch, like the original
; player's camera - looking down swings it up overhead with the character
; centered in frame, looking up drops it low behind. Height is the focus
; point above the feet; Distance is the orbit radius.
; v15: 125/50 - rest view sits a bit further from and lower than her head
; (v14's 108/66 orbited right at head height and framed too close).
Distance=125
; v6 Height=78 too high; v7 Height=50 too low/close. v8 sits further back and up.
Height=50
; Unreal rotation units: 65536 = 360 degrees. Negative looks downward.
Pitch=-1400
; 1 = probe the camera position and slide it in against walls.
Collision=1
; FovMode=1 (default) recomputes each strip's FOV so the VERTICAL field
; matches the original full-screen view - characters keep their real
; proportions instead of being squeezed into the half-width pane.
; FovMode=0 passes the engine FOV through unchanged.
FovMode=1
; Extra FOV multiplier in percent. 100 = geometrically correct. 120 = a
; bit wider if the strip still feels cramped. Range 50..200.
FovScale=100

[actions]
; 0 (default since v18) = fire straight along the camera - the spell goes
;     exactly where the spark glow points. Recommended for split screen.
; 1 = soft auto-aim: the cast picks the best target in a cone in front of the
;     caster (spell triggers and characters, never the other players) and the
;     glow jumps onto whatever it locks so you can see it. The spell then
;     homes at that target instead of flying straight.
AimedCast=0
; Rendering style of the aiming glow (v23):
;   6 (default) = additive sprite glow - the ONLY variant proven VISIBLE
;                 on real hardware D3D8 so far (v18/v19/v21/v23). Keeps
;                 clear of the caster's body (110-unit horizontal rule).
;   0            = borrow the level's own SpellCursor (v22). Renders only
;                 under Wine - INVISIBLE on the test hardware. Kept for
;                 reference; the D-key diagnostic (see README) hunts the
;                 real player-1 marker for a future build.
;   8            = v20's bare particle emitter (also hw-invisible).
GlowStyle=6
; Size of the aiming glow marker, in percent (applies to style 6 only -
; style 0 uses the game's own size). v24 default 36 = the old 60 reduced
; by 40% on user request. Range 20..200.
GlowSize=36
; CastExitAdj (v40) - milliseconds between the cast animation's natural end
; and the mod ending the casting state. Default 90 = the timing that removed
; the post-cast pose snap. If YOUR setup shows a brief weird stance / wrong facing
; / shake on player 2 after a cast, try 250 or 400 (closer to the old timing)
; or 40, one value at a time, and send hp3mod.log - the [cast] run#N lines
; show the exit and animation re-pick. Range 40..600.
CastExitAdj=90
; Post-cast pose cleanup (v23):
;   full (default) - exits the casting STATE (required: v22 hardware
;           proved without it the pose hangs forever, even while running)
;           and tells the anim system casting ended - nothing else. The
;           proven exit call set is unchanged. Since v48, ONE animation
;           re-pick after the exit settles pose/facing once standing still.
;   light  - NO state exit (v22 default) - the pose WILL hang; kept only
;           as a documented experiment. Do not use.
Cleanup=full
; CleanupChain (v26) - which calls the post-cast cleanup chain makes.
;   full (default) = exit + blendOutCast + StopCasting +
;           SwitchToNormalStanceAnims + AnimEnd. HARDWARE-PROVEN pose
;           exit (v23). Every reduction ever tested hung the pose on
;           hardware: no exit (v22), no AnimEnd (v24), exitanim (v25).
;           DO NOT change this on hardware.
;   noanimend, exitanim, min = documented hang-bait experiments.
CleanupChain=full
; CleanupDelay (v25) - milliseconds after the spell leaves before the
; cleanup chain fires (default 1200). Range 400..2600. When the cast
; animation's own end is visible in the engine's events the chain runs
; there instead (AnimEnd + CastExitAdj) - that timing is what removed
; the pose snap. The delay is then only the fallback (Wine, and any
; cast whose AnimEnd the mod cannot see).
CleanupDelay=1200
; (v48) The post-cast cleanup is now ONE run per cast: created when the
; spell leaves, dropped the moment a newer cast takes the character.
; Casting again quickly can therefore no longer cancel the previous
; cast's exit (that was the stuck-pose cause: the old bookkeeping was
; only cleared when a cast's 4s watch expired, so a re-cast within 4s
; silently inherited "cleanup already done" and got no exit at all).
; NoDip (v49) - repair floor contact at the cast exit. v48's saved-Z /
; Physics-byte reset only postponed the hop until movement resumed.
;   1 (default) = call native SetPhysics(Walking) / FindBase at the CURRENT
;       exit position, then let walking physics validate contact before
;       idle may freeze it. One attempt per exit: no saved-height writes,
;       no repeated fall resets, no default falling/landing anim swallow.
;       Jumps, missing support and failed validation release to the engine.
;   0 = disable the handoff; use the legacy animation-only fallback.
; Pose cleanup and its one re-pick are unchanged in either mode.
; Hardware verification: cast, wait 5 seconds, then move; also try moving
; casts, rapid re-casts, jumps and ledges. Send hp3mod.log if a hop remains:
; [castground] logs Base/Floor before/after, "verified", or "released".
NoDip=1
; ---- v24/v26 isolation knobs for the aim glow ---------------------------
; BodyClear=1: v24's body-clearance placement gate (default on).
; PanePark=1: v26's per-pane glow parking (default on - this is what
;   finally kept the glow out of player 1's half; =0 makes the glow
;   visible in both halves again, diagnostic only).
BodyClear=1
PanePark=1

[debug]
; The "split_on" file trigger is for automated testing only and is OFF by
; default. It must never be authoritative over the key toggle.
FileToggle=0
; 1 = write hp3mod.log next to the game executable. Set to 0 for a silent install.
Log=1
